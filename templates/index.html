<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaWorks Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<section id="login" hidden>
  <form id="loginForm">
    <h1>NovaWorks</h1>
    <p class="muted">Log in to see your projects and tasks.</p>
    <label>Email <input id="email" type="email" required autocomplete="username"></label>
    <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
    <p id="loginError" class="error" role="alert"></p>
    <button class="primary">Log in</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <strong>NovaWorks</strong>
    <nav id="nav"></nav>
    <span id="who" class="muted"></span>
    <button id="logout">Log out</button>
  </header>
  <main id="view"></main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
